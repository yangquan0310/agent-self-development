name: Release Plugin

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  branch-sync-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch all branches
        run: |
          git fetch origin dev beta main --depth=1

      - name: Verify code content is in sync (dev→beta→main)
        run: |
          # 检查 dev 是否包含在 beta 中
          dev_in_beta=$(git merge-base --is-ancestor origin/dev origin/beta && echo "yes" || echo "no")
          # 检查 beta 是否包含在 main 中
          beta_in_main=$(git merge-base --is-ancestor origin/beta origin/main && echo "yes" || echo "no")
          
          echo "dev is ancestor of beta: $dev_in_beta"
          echo "beta is ancestor of main: $beta_in_main"
          
          if [ "$dev_in_beta" != "yes" ]; then
            echo "ERROR: dev is not merged into beta"
            echo "Must push dev to origin first, wait for CI to pass, then push beta"
            exit 1
          fi
          
          if [ "$beta_in_main" != "yes" ]; then
            echo "ERROR: beta is not merged into main"
            echo "Must push beta to origin first, wait for CI to pass, then push main"
            exit 1
          fi
          
          echo "✓ Code is properly synced: dev→beta→main"

      - name: Verify tag is on main
        run: |
          tag_hash=$(git rev-parse ${{ github.ref }})
          main_hash=$(git rev-parse origin/main)
          
          echo "tag commit:  $tag_hash"
          echo "main commit: $main_hash"
          
          if [ "$tag_hash" != "$main_hash" ]; then
            echo "ERROR: tag ($tag_hash) != main ($main_hash)"
            echo "Tag must be pushed on main branch"
            exit 1
          fi
          
          echo "✓ Tag points to main commit"

  verify:
    needs: branch-sync-check
    runs-on: ubuntu-latest
    needs: branch-sync-check
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Verify all JS files syntax
        run: |
          failed=0
          for f in $(find src -name '*.js' -not -path '*/node_modules/*'); do
            echo "Checking: $f"
            node --check "$f" || failed=1
          done
          if [ $failed -ne 0 ]; then
            echo "Syntax check failed!"
            exit 1
          fi
          echo "All JS files syntax OK"

      - name: Verify package.json version matches openclaw.plugin.json
        run: |
          pkg_version=$(node -p "require('./package.json').version")
          plugin_version=$(node -p "require('./openclaw.plugin.json').version")
          echo "package.json: $pkg_version"
          echo "openclaw.plugin.json: $plugin_version"
          if [ "$pkg_version" != "$plugin_version" ]; then
            echo "Version mismatch!"
            exit 1
          fi
          echo "Version check OK"

      - name: Verify openclaw.plugin.json is valid JSON
        run: node -e "JSON.parse(require('fs').readFileSync('./openclaw.plugin.json', 'utf8')); console.log('openclaw.plugin.json valid')"

      - name: Run tests
        run: npm test
        continue-on-error: true

      - name: Verify packagable
        run: npm pack --dry-run

  release:
    needs: [branch-sync-check, verify]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Pack
        run: npm pack

      - name: Repack without package/ prefix
        run: |
          mkdir -p _extract
          tar xzf agent-self-development-*.tgz -C _extract --strip-components=1
          rm agent-self-development-*.tgz
          cd _extract
          tar czf ../agent-self-development-$(node -p "require('../package.json').version').tgz .
          cd ..
          rm -rf _extract

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: agent-self-development-*.tgz
          generate_release_notes: true