name: Release Plugin

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  version-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify version consistency
        run: |
          pkg_version=$(node -p "require('./package.json').version")
          plugin_version=$(node -p "require('./openclaw.plugin.json').version")
          tag_version="${GITHUB_REF#refs/tags/v}"
          
          echo "package.json version:  $pkg_version"
          echo "openclaw.plugin.json version: $plugin_version"
          echo "Tag version:          v$tag_version"
          
          # 检查 package.json 和 openclaw.plugin.json 是否一致
          if [ "$pkg_version" != "$plugin_version" ]; then
            echo "ERROR: package.json ($pkg_version) != openclaw.plugin.json ($plugin_version)"
            exit 1
          fi
          
          # 检查 tag 版本号是否与文件一致
          if [ "$pkg_version" != "$tag_version" ]; then
            echo "ERROR: package.json version ($pkg_version) != tag version ($tag_version)"
            exit 1
          fi
          
          echo "✓ Version check passed"

  verify:
    needs: version-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Verify all JS files syntax
        run: |
          failed=0
          for f in $(find src -name '*.js' -not -path '*/node_modules/*'); do
            echo "Checking: $f"
            node --check "$f" || failed=1
          done
          if [ $failed -ne 0 ]; then
            echo "Syntax check failed!"
            exit 1
          fi
          echo "All JS files syntax OK"

      - name: Verify openclaw.plugin.json is valid JSON
        run: node -e "JSON.parse(require('fs').readFileSync('./openclaw.plugin.json', 'utf8')); console.log('openclaw.plugin.json valid')"

      - name: Run tests
        run: npm test
        continue-on-error: true

      - name: Verify packagable
        run: npm pack --dry-run

  release:
    needs: [version-check, verify]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Pack
        run: npm pack

      - name: Repack without package/ prefix
        run: |
          mkdir -p _extract
          tar xzf agent-self-development-*.tgz -C _extract --strip-components=1
          rm agent-self-development-*.tgz
          cd _extract
          tar czf ../agent-self-development-$(node -p "require('../package.json').version').tgz .
          cd ..
          rm -rf _extract

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: agent-self-development-*.tgz
          generate_release_notes: true