name: Release Plugin

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  branch-sync-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check dev branch
        run: |
          git fetch origin dev
          echo "dev commit: $(git rev-parse origin/dev)"

      - name: Check beta branch
        run: |
          git fetch origin beta
          echo "beta commit: $(git rev-parse origin/beta)"

      - name: Check main branch
        run: |
          git fetch origin main
          echo "main commit: $(git rev-parse origin/main)"

      - name: Verify all branches sync to dev
        run: |
          dev_hash=$(git rev-parse origin/dev)
          beta_hash=$(git rev-parse origin/beta)
          main_hash=$(git rev-parse origin/main)
          tag_hash=$(git rev-parse ${{ github.ref }})
          
          echo "=== Branch Hashes (default: dev) ==="
          echo "dev:  $dev_hash"
          echo "beta: $beta_hash"
          echo "main: $main_hash"
          echo "tag:  $tag_hash"
          
          if [ "$dev_hash" != "$beta_hash" ]; then
            echo "ERROR: dev ($dev_hash) != beta ($beta_hash)"
            echo "Must push dev to origin first, wait for CI to pass, then push beta"
            exit 1
          fi
          
          if [ "$dev_hash" != "$main_hash" ]; then
            echo "ERROR: dev ($dev_hash) != main ($main_hash)"
            echo "Must push beta to origin first, wait for CI to pass, then push main"
            exit 1
          fi
          
          if [ "$tag_hash" != "$dev_hash" ]; then
            echo "ERROR: tag ($tag_hash) != dev ($dev_hash)"
            echo "Tag must point to dev (default branch)"
            exit 1
          fi
          
          echo "✓ All branches (dev, beta, main) are in sync with dev!"
          echo "✓ Tag points to dev commit"

  verify:
    needs: branch-sync-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Verify all JS files syntax
        run: |
          failed=0
          for f in $(find src -name '*.js' -not -path '*/node_modules/*'); do
            echo "Checking: $f"
            node --check "$f" || failed=1
          done
          if [ $failed -ne 0 ]; then
            echo "Syntax check failed!"
            exit 1
          fi
          echo "All JS files syntax OK"

      - name: Verify package.json version matches openclaw.plugin.json
        run: |
          pkg_version=$(node -p "require('./package.json').version")
          plugin_version=$(node -p "require('./openclaw.plugin.json').version")
          echo "package.json: $pkg_version"
          echo "openclaw.plugin.json: $plugin_version"
          if [ "$pkg_version" != "$plugin_version" ]; then
            echo "Version mismatch!"
            exit 1
          fi
          echo "Version check OK"

      - name: Verify openclaw.plugin.json is valid JSON
        run: node -e "JSON.parse(require('fs').readFileSync('./openclaw.plugin.json', 'utf8')); console.log('openclaw.plugin.json valid')"

      - name: Run tests
        run: npm test
        continue-on-error: true

      - name: Verify packagable
        run: npm pack --dry-run

  release:
    needs: [branch-sync-check, verify]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Pack
        run: npm pack

      - name: Repack without package/ prefix
        run: |
          mkdir -p _extract
          tar xzf agent-self-development-*.tgz -C _extract --strip-components=1
          rm agent-self-development-*.tgz
          cd _extract
          tar czf ../agent-self-development-$(node -p "require('../package.json').version").tgz .
          cd ..
          rm -rf _extract

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: agent-self-development-*.tgz
          generate_release_notes: true